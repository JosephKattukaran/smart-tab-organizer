name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifest.json
        run: |
          python3 -c "import json; json.load(open('.github/code/manifest.json'))"

      - name: Install ESLint
        run: |
          npm install

      - name: Run Lint
        run: |
          npx eslint .